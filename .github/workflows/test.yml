name: Offline tests
on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test
      - run: cmake -S native/rgi -B build/rgi -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang
      - run: cmake --build build/rgi
      - run: ctest --test-dir build/rgi --output-on-failure
